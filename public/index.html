<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Monarch Smart CFO — Copilot Edition</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    /* =====================================================================
       APPLE DESIGN / COPILOT MONEY DUAL-THEME DESIGN TOKENS
       ===================================================================== */
    html[data-theme="dark"] {
      --app-bg: #090b10;
      --sidebar-bg: #0d1017;
      --inspector-bg: #0e121a;
      --topbar-bg: rgba(13, 16, 23, 0.82);
      --card-bg: #131822;
      --card-hover: #19202e;
      --inset-bg: #0a0d13;
      --border-hairline: rgba(255, 255, 255, 0.07);
      --border-strong: rgba(255, 255, 255, 0.13);
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --shadow-elevated: 0 12px 32px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.06);
      --bar-track: #1e2636;
      --today-marker: #f8fafc;
      --chart-grid: rgba(255, 255, 255, 0.05);
    }

    html[data-theme="light"] {
      --app-bg: #f3f5f9;
      --sidebar-bg: #ffffff;
      --inspector-bg: #ffffff;
      --topbar-bg: rgba(255, 255, 255, 0.88);
      --card-bg: #ffffff;
      --card-hover: #f8fafc;
      --inset-bg: #f1f5f9;
      --border-hairline: rgba(15, 23, 42, 0.08);
      --border-strong: rgba(15, 23, 42, 0.15);
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --text-muted: #94a3b8;
      --shadow-elevated: 0 6px 20px rgba(15, 23, 42, 0.06), 0 1px 2px rgba(15, 23, 42, 0.04);
      --bar-track: #e2e8f0;
      --today-marker: #0f172a;
      --chart-grid: rgba(15, 23, 42, 0.06);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--app-bg);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .tabular {
      font-variant-numeric: tabular-nums;
      font-family: "SF Mono", "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    /* 3-Pane Full-Viewport Desktop App Shell */
    .desktop-shell {
      display: grid;
      grid-template-columns: 236px 1fr auto;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    .pane-sidebar {
      background: var(--sidebar-bg);
      border-right: 1px solid var(--border-hairline);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow-y: auto;
      padding: 16px 12px;
      gap: 16px;
      user-select: none;
    }

    .pane-center {
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow-y: auto;
      min-width: 0;
      background: var(--app-bg);
    }

    .pane-inspector {
      width: 368px;
      background: var(--inspector-bg);
      border-left: 1px solid var(--border-hairline);
      height: 100vh;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      transition: width 0.2s ease;
    }

    .pane-inspector.closed {
      width: 0;
      border-left: none;
      overflow: hidden;
    }

    /* Sticky Topbar inside Center Pane */
    .center-topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      background: var(--topbar-bg);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-hairline);
      padding: 12px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    /* Cards & Tactile Surfaces */
    .c-card {
      background: var(--card-bg);
      border: 1px solid var(--border-hairline);
      box-shadow: var(--shadow-elevated);
      border-radius: 16px;
    }

    .c-inset {
      background: var(--inset-bg);
      border: 1px solid var(--border-hairline);
      border-radius: 12px;
    }

    /* Navigation Rail Items */
    .nav-item {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 11px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-secondary);
      cursor: pointer;
      border: 1px solid transparent;
      background: transparent;
      transition: all 0.14s ease;
      text-align: left;
    }

    .nav-item:hover {
      background: var(--card-hover);
      color: var(--text-primary);
    }

    .nav-item.active {
      background: rgba(16, 185, 129, 0.13);
      color: #10b981;
      border-color: rgba(16, 185, 129, 0.28);
      font-weight: 600;
    }

    /* Interactive Row Items (Categories, Transactions, Recurring) */
    .interactive-row {
      padding: 11px 14px;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.14s ease;
      border: 1px solid transparent;
    }

    .interactive-row:hover {
      background: var(--card-hover);
    }

    .interactive-row.selected {
      background: rgba(14, 165, 233, 0.1);
      border-color: rgba(14, 165, 233, 0.35);
    }

    /* Copilot Signature Budget Bar with Vertical Today Marker */
    .copilot-bar-wrap {
      position: relative;
      width: 100%;
      height: 8px;
      background: var(--bar-track);
      border-radius: 99px;
      overflow: visible;
    }

    .copilot-bar-fill {
      height: 100%;
      border-radius: 99px;
      transition: width 0.3s ease;
    }

    .copilot-today-tick {
      position: absolute;
      top: -3px;
      bottom: -3px;
      width: 2px;
      background: var(--today-marker);
      border-radius: 2px;
      z-index: 5;
      box-shadow: 0 0 4px rgba(0,0,0,0.5);
    }

    /* Segmented Control */
    .seg-group {
      background: var(--inset-bg);
      border: 1px solid var(--border-hairline);
      border-radius: 10px;
      padding: 3px;
      display: inline-flex;
      gap: 2px;
    }

    .seg-btn {
      padding: 5px 10px;
      border-radius: 7px;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-secondary);
      cursor: pointer;
      border: none;
      background: transparent;
      transition: all 0.14s ease;
    }

    .seg-btn.active {
      background: var(--card-bg);
      color: var(--text-primary);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.18);
      font-weight: 600;
    }

    /* Range Slider */
    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 6px;
      background: var(--bar-track);
      border-radius: 99px;
      outline: none;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #10b981;
      border: 2px solid #ffffff;
      box-shadow: 0 2px 6px rgba(0,0,0,0.35);
      cursor: pointer;
    }

    /* Responsive collapse for smaller viewports */
    @media (max-width: 1120px) {
      .desktop-shell {
        grid-template-columns: 200px 1fr;
      }
      .pane-inspector {
        position: fixed;
        right: 0;
        top: 0;
        z-index: 40;
        box-shadow: -12px 0 40px rgba(0, 0, 0, 0.5);
      }
    }
  </style>
</head>

    function computeMetrics() {
      const o = app.owner;
      let income, cash, checking, nw, brokerage = 196400;

      if (app.isRealData) {
        const ownerAccounts = app.accounts.filter(a => o === 'all' || a.owner === o || !a.owner);
        income = Number(app.monthlyIncome?.[o] || app.monthlyIncome?.all || 10000);
        cash = 0;
        checking = 0;
        nw = 0;
        brokerage = 0;
        for (const a of ownerAccounts) {
          const b = Number(a.bal || 0);
          nw += b;
          const t = String(a.type || '').toLowerCase();
          if (t.includes('cash') || t.includes('checking') || t.includes('savings') || t.includes('hysa')) {
            if (b > 0) cash += b;
            if (!t.includes('hysa') && !t.includes('savings') && b > 0) {
              checking += b;
            }
          } else if (t.includes('invest') || t.includes('brokerage')) {
            if (b > 0) brokerage += b;
          }
        }
        if (checking === 0 && cash > 0) checking = Math.round(cash * 0.35);
      } else {
        const incomeByOwner = { all: 14800, joint: 14800, partner_a: 8400, partner_b: 6400 };
        const cashByOwner = { all: 80661, joint: 72621, partner_a: 4150, partner_b: 3890 };
        const checkingByOwner = { all: 26461, joint: 18421, partner_a: 4150, partner_b: 3890 };
        const nwByOwner = { all: 189632, joint: 112400, partner_a: 168105, partner_b: 145578 };
        income = incomeByOwner[o] || 14800;
        cash = cashByOwner[o] || 80661;
        checking = checkingByOwner[o] || 26461;
        nw = nwByOwner[o] || 189632;
      }

      let fixedBurn = 0;
      let rawDiscBurn = 0;
      let totalBudget = 0;
      let mtdSpend = 0;

      for (const c of app.categories) {
        const val = c.avg?.[o] ?? c.avg?.all ?? Number(c.budget || 0);
        if (c.type === 'fixed') fixedBurn += val;
        else rawDiscBurn += val;
        totalBudget += Number(c.budget || 0);
        mtdSpend += Number(c.mtd || 0);
      }

      const discBurn = Math.round(rawDiscBurn * (1 - app.discCutPct / 100));
      const totalBurn = fixedBurn + discBurn;
      const savings = Math.max(0, income - totalBurn);
      const savingsPct = income > 0 ? ((savings / income) * 100).toFixed(1) : '0.0';
      const fixedPct = income > 0 ? ((fixedBurn / income) * 100).toFixed(1) : '0.0';
      const discPct = income > 0 ? ((discBurn / income) * 100).toFixed(1) : '0.0';

      const baselineRunway = fixedBurn > 0 ? (cash / fixedBurn).toFixed(1) : '99.0';
      const fullRunway = totalBurn > 0 ? (totalBurn > 0 ? (cash / totalBurn).toFixed(1) : '99.0') : '99.0';
      const extendedRunway = fixedBurn > 0 ? ((cash + brokerage) / fixedBurn).toFixed(1) : '99.0';

      const upcoming30dBills = app.isRealData
        ? Math.round(app.recurring.reduce((s, r) => s + Number(r.curr || 0), 0))
        : 4448;
      const requiredChecking = upcoming30dBills + Number(app.safetyBuffer);
      const sweepableCash = Math.max(0, checking - requiredChecking);
      const annualYieldGain = Math.round(sweepableCash * ((Number(app.hysaApy) - 0.05) / 100));

      return {
        income, cash, checking, nw,
        fixedBurn, discBurn, rawDiscBurn, totalBurn, savings,
        savingsPct, fixedPct, discPct,
        baselineRunway, fullRunway, extendedRunway,
        upcoming30dBills, requiredChecking, sweepableCash, annualYieldGain,
        totalBudget, mtdSpend
      };
    }

      if (ev) ev.stopPropagation();
      const item = app.triage.find(x => x.id === id);
      if (!item || item.status !== 'staged') return;
      item.status = 'approved';
      app.mcpUsed += 1;
      document.getElementById('side-quota').textContent = `${app.mcpUsed} / 150`;
      app.undoLog.unshift({
        undoId: 'u_' + Date.now() + '_' + id,
        triageId: id,
        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' }),
        amount: item.amount,
        beforeMerchant: item.before.merchant,
        afterMerchant: item.after.merchant,
        afterCategory: item.after.category
      });
      saveAppStateToServer();
      showToast(`✓ Approved "${item.after.merchant}" & saved reversible snapshot in SQLite Undo Log`);
      renderAll();
    }

    function revertUndo(undoId) {
      const idx = app.undoLog.findIndex(u => u.undoId === undoId);
      if (idx === -1) return;
      const entry = app.undoLog[idx];
      const item = app.triage.find(x => x.id === entry.triageId);
      if (item) item.status = 'staged';
      app.undoLog.splice(idx, 1);
      saveAppStateToServer();
      showToast(`↺ Reverted "${entry.afterMerchant}" back to "${entry.beforeMerchant}"`);
      renderAll();
    }

    function buildHeroPaceChart(m) {

      const y = v => +(padT + plotH - (v / maxY) * plotH).toFixed(1);

      let days;
      if (app.isRealData) {
        const recent = app.transactions.slice(0, 7).reverse();
        let running = 0;
        days = Array.from({ length: 7 }, (_, idx) => {
          const dNum = idx + 1;
          const tx = recent[idx];
          running = dNum === 7 ? m.mtdSpend : Math.min(m.mtdSpend, Math.round((m.mtdSpend / 7) * dNum));
          return {
            d: dNum,
            v: running,
            desc: tx ? `${tx.date} • ${tx.merchant.slice(0, 18)}` : `Day ${dNum} MTD`
          };
        });
      } else {
        days = [
          { d: 1, v: 3150, desc: 'Nov 1 • Rocket Mortgage ($3,150)' },

      }

      const endEst = Math.max(m.mtdSpend, m.totalBurn || m.totalBudget);
      const step = (endEst - m.mtdSpend) / 6;
      const proj = [
        [7, m.mtdSpend],
        [12, Math.round(m.mtdSpend + step * 1)],
        [16, Math.round(m.mtdSpend + step * 2)],
        [18, Math.round(m.mtdSpend + step * 3)],
        [21, Math.round(m.mtdSpend + step * 4)],
        [24, Math.round(m.mtdSpend + step * 5)],

              <stop offset="100%" stop-color="#10b981" stop-opacity="0.0" />
            </linearGradient>
          </defs>
          ${[0.3, 0.6, 0.9].map(r => {
            const gv = Math.round((maxY * r) / 500) * 500;
            return `
            <line x1="${padL}" y1="${y(gv)}" x2="${w - padR}" y2="${y(gv)}" stroke="var(--chart-grid)" stroke-width="1" />
            <text x="${padL - 8}" y="${y(gv) + 4}" text-anchor="end" fill="var(--text-muted)" font-size="11" font-family="monospace">$${(gv / 1000).toFixed(1)}k</text>
          `;

          <!-- Ideal Pace Line -->

          <!-- Projected Curve -->
          <polyline fill="none" stroke="#f43f5e" stroke-width="2" stroke-dasharray="4 4" points="${projPts}" />

          <polygon points="${areaPts}" fill="url(#copilotSpendGrad)" />
          <polyline fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round" points="${actualPts}" />

          <!-- Interactive Scrubber Nodes -->

    function buildSankeyDiagram(m) {
      const w = 820, h = 240;
      const x0 = 20, x1 = 240, x2 = 520;
      const nw = 10;
      const poolTop = 30, poolH = 180;
      const incTotal = Math.max(1, m.income || 14800);
      const pA = Math.round(incTotal * 0.56);
      const pB = Math.max(0, incTotal - pA);
      const partAH = (pA / incTotal) * poolH;
      const partBH = (pB / incTotal) * poolH;
      const denom = Math.max(incTotal, m.fixedBurn + m.discBurn + m.savings, 1);
      const fixedH = Math.max(24, (m.fixedBurn / denom) * poolH);
      const discH = Math.max(24, (m.discBurn / denom) * poolH);
      const saveH = Math.max(24, (m.savings / denom) * poolH);

      const ribbon = (xa, ya0, ya1, xb, yb0, yb1) => {
        const cx = (xa + xb) / 2;
        return `M ${xa} ${ya0} C ${cx} ${ya0}, ${cx} ${yb0}, ${xb} ${yb0} L ${xb} ${yb1} C ${cx} ${yb1}, ${cx} ${ya1}, ${xa} ${ya1} Z`;
      };

      return `
        <svg viewBox="0 0 ${w} ${h}" class="w-full h-auto block">
          <path d="${ribbon(x0 + nw, 24, 24 + partAH, x1, poolTop, poolTop + partAH)}" fill="#38bdf8" opacity="0.32" />
          <path d="${ribbon(x0 + nw, 42 + partAH, 42 + partAH + partBH, x1, poolTop + partAH, poolTop + poolH)}" fill="#fbbf24" opacity="0.32" />

          <path d="${ribbon(x1 + nw, poolTop, poolTop + fixedH, x2, 18, 18 + fixedH)}" fill="#06b6d4" opacity="0.45" />
          <path d="${ribbon(x1 + nw, poolTop + fixedH, poolTop + fixedH + discH, x2, 32 + fixedH, 32 + fixedH + discH)}" fill="#f59e0b" opacity="0.45" />
          <path d="${ribbon(x1 + nw, poolTop + fixedH + discH, poolTop + poolH, x2, 46 + fixedH + discH, 46 + fixedH + discH + saveH)}" fill="#10b981" opacity="0.52" />

          <rect x="${x0}" y="24" width="${nw}" height="${partAH}" rx="3" fill="#38bdf8" />

    function buildNetWorthCurve() {
      const w = 820, h = 215, padL = 48, padR = 22, padT = 20, padB = 28;
      const plotW = w - padL - padR, plotH = h - padT - padB;
      const m = computeMetrics();
      const months = ['Dec', 'Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov'];
      const pts = app.isRealData
        ? months.map((mName, i) => ({
            m: mName,
            v: Math.round(m.nw - (11 - i) * Math.max(500, m.savings || 1500))
          }))
        : [
            { m: 'Dec', v: 95200 }, { m: 'Jan', v: 106800 }, { m: 'Feb', v: 114700 }, { m: 'Mar', v: 125300 },
            { m: 'Apr', v: 134900 }, { m: 'May', v: 145200 }, { m: 'Jun', v: 156300 }, { m: 'Jul', v: 165900 },
            { m: 'Aug', v: 173900 }, { m: 'Sep', v: 180700 }, { m: 'Oct', v: 185700 }, { m: 'Nov', v: 189632 }
          ];
      const vals = pts.map(p => p.v);
      const minV = Math.min(...vals);
      const maxV = Math.max(...vals);
      const span = Math.max(1000, maxV - minV);
      const x = i => +(padL + (i / (pts.length - 1)) * plotW).toFixed(1);
      const y = v => +(padT + plotH - ((v - (minV - span * 0.1)) / (span * 1.25)) * plotH).toFixed(1);
      const line = pts.map((p, i) => `${x(i)},${y(p.v)}`).join(' ');
      const area = `${x(0)},${padT + plotH} ` + line + ` ${x(pts.length - 1)},${padT + plotH}`;

      return `
        <svg viewBox="0 0 ${w} ${h}" class="w-full h-auto block">
          <defs>
            <linearGradient id="nwCurveGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.32" />
              <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.0" />
            </linearGradient>
          </defs>
          <polygon points="${area}" fill="url(#nwCurveGrad)" />
          <polyline fill="none" stroke="#06b6d4" stroke-width="3" points="${line}" />
          ${pts.map((p, i) => `
            <circle cx="${x(i)}" cy="${y(p.v)}" r="3.5" fill="#06b6d4" stroke="var(--card-bg)" stroke-width="1.5" />
            <text x="${x(i)}" y="${h - 6}" text-anchor="middle" fill="var(--text-muted)" font-size="11">${p.m}</text>
          `).join('')}
        </svg>
      `;
    }

    function parseCsvRows(text) {
      const rows = [];
      let row = [], cur = '', inQuotes = false;
      for (let i = 0; i < text.length; i++) {
        const ch = text[i];
        const next = text[i + 1];
        if (inQuotes) {
          if (ch === '"' && next === '"') { cur += '"'; i++; }
          else if (ch === '"') inQuotes = false;
          else cur += ch;
        } else {
          if (ch === '"') inQuotes = true;
          else if (ch === ',') { row.push(cur.trim()); cur = ''; }
          else if (ch === '\n' || ch === '\r') {
            if (ch === '\r' && next === '\n') i++;
            row.push(cur.trim());
            if (row.some(c => c !== '')) rows.push(row);
            row = [];
            cur = '';
          } else cur += ch;
        }
      }
      if (cur || row.length) {
        row.push(cur.trim());
        if (row.some(c => c !== '')) rows.push(row);
      }
      if (rows.length < 2) return [];
      const headers = rows[0].map(h => h.replace(/^\uFEFF/, '').trim().toLowerCase());
      return rows.slice(1).map(r => {
        const obj = {};
        headers.forEach((h, idx) => { obj[h] = r[idx] ?? ''; });
        return obj;
      });
    }

    async function importMonarchCsvFiles() {
      const txInput = document.getElementById('csv-tx-input');
      const balInput = document.getElementById('csv-bal-input');
      if (!txInput || !txInput.files || !txInput.files[0]) {
        showToast('Please select your Monarch Transactions CSV file first.');
        return;
      }

      const txText = await txInput.files[0].text();
      const txRows = parseCsvRows(txText);
      if (!txRows.length) {
        showToast('Could not parse rows from Transactions CSV.');
        return;
      }

      const fixedKeywords = ['mortgage', 'rent', 'utilities', 'utility', 'electric', 'water', 'gas', 'internet', 'fiber', 'phone', 'insurance', 'auto payment', 'car payment', 'loan', 'childcare', 'daycare', 'tuition', 'hoa', 'tax', 'subscriptions'];
      const skipKeywords = ['transfer', 'credit card payment', 'payment'];
      const palette = ['#10b981', '#06b6d4', '#38bdf8', '#f59e0b', '#f43f5e', '#8b5cf6', '#ec4899', '#14b8a6', '#eab308', '#3b82f6'];

      // Determine latest month in CSV
      const dates = txRows.map(r => r.date || '').filter(Boolean).sort();
      const latestDate = dates[dates.length - 1] || new Date().toISOString().slice(0, 10);
      const latestYm = latestDate.slice(0, 7);

      const monthsSet = new Set();
      let totalPositiveIncome = 0;
      const catMap = new Map();
      const acctSet = new Set();
      const parsedTxs = [];
      const triageItems = [];

      for (const r of txRows) {
        const dt = r.date || '';
        const ym = dt.slice(0, 7);
        if (ym) monthsSet.add(ym);
        const merchant = r.merchant || r['original statement'] || 'Merchant';
        const origStmt = r['original statement'] || merchant;
        const catName = r.category || 'Uncategorized';
        const acctName = r.account || 'Primary Account';
        const amtRaw = parseFloat(String(r.amount || '0').replace(/[^0-9.-]/g, '')) || 0;
        const tags = r.tags || '';
        const notes = r.notes || '';
        acctSet.add(acctName);

        const catLower = catName.toLowerCase();
        if (skipKeywords.some(k => catLower === k || catLower.includes('credit card payment'))) continue;

        if (amtRaw > 0 && (catLower.includes('paycheck') || catLower.includes('income') || catLower.includes('salary') || amtRaw >= 500)) {
          totalPositiveIncome += amtRaw;
          continue;
        }

        if (amtRaw >= 0) continue;
        const spend = Math.abs(amtRaw);

        if (!catMap.has(catName)) {
          const isFixed = fixedKeywords.some(k => catLower.includes(k));
          catMap.set(catName, {
            id: 'cat_' + catName.toLowerCase().replace(/[^a-z0-9]+/g, '_'),
            name: catName,
            icon: isFixed ? '🏠' : '💳',
            group: isFixed ? 'Fixed Baseline' : 'Flexible Living',
            type: isFixed ? 'fixed' : 'discretionary',
            color: palette[catMap.size % palette.length],
            byMonth: {},
            totalSpend: 0,
            mtd: 0,
            merchants: {}
          });
        }
        const cEntry = catMap.get(catName);
        cEntry.totalSpend += spend;
        cEntry.byMonth[ym] = (cEntry.byMonth[ym] || 0) + spend;
        if (ym === latestYm) cEntry.mtd += spend;
        cEntry.merchants[merchant] = (cEntry.merchants[merchant] || 0) + spend;

        if (parsedTxs.length < 40) {
          parsedTxs.push({
            id: 'tx_' + parsedTxs.length,
            date: dt.slice(5),
            merchant,
            catId: cEntry.id,
            amount: Math.round(spend * 100) / 100,
            account: acctName,
            owner: 'joint',
            avatar: merchant.slice(0, 1).toUpperCase(),
            color: cEntry.color,
            tag: tags ? '#' + tags.split(',')[0].trim() : '#Monarch'
          });
        }

        if (triageItems.length < 10 && (catLower.includes('uncategorized') || /^(SQ \*|TST\*|AMZN|PAYPAL \*)/i.test(origStmt))) {
          const cleanName = origStmt.replace(/^(SQ \*|TST\*\s*)/i, '').trim();
          triageItems.push({
            id: 'tri_' + (triageItems.length + 1),
            date: dt.slice(5),
            fullDate: dt,
            amount: Math.round(spend * 100) / 100,
            avatar: cleanName.slice(0, 1).toUpperCase(),
            avatarBg: cEntry.color,
            account: acctName,
            owner: 'joint',
            catId: cEntry.id,
            issue: catLower.includes('uncategorized') ? 'Uncategorized' : 'Messy POS Name',
            confidence: 94,
            before: { merchant: origStmt, category: catName, tags: tags || 'None' },
            after: { merchant: cleanName, category: catLower.includes('uncategorized') ? 'Shopping & General' : catName, tags: '#Reviewed' },
            reason: notes ? `Note: "${notes}"` : `Detected from Monarch CSV (${dt})`,
            status: 'staged'
          });
        }
      }

      const sortedMonths = Array.from(monthsSet).sort().slice(-6);
      const numMonths = Math.max(1, sortedMonths.length);
      const avgMonthlyIncome = totalPositiveIncome > 0 ? Math.round(totalPositiveIncome / Math.max(1, monthsSet.size)) : 12000;

      const newCategories = Array.from(catMap.values())
        .sort((a, b) => b.totalSpend - a.totalSpend)
        .slice(0, 14)
        .map(c => {
          const hist = sortedMonths.map(m => Math.round(c.byMonth[m] || 0));
          while (hist.length < 6) hist.unshift(hist[0] || 0);
          const avgAll = Math.round(hist.reduce((s, v) => s + v, 0) / hist.length) || Math.round(c.totalSpend / numMonths);
          const topMerchants = Object.entries(c.merchants)
            .sort((a, b) => b[1] - a[1])
            .slice(0, 3)
            .map(([n, v]) => ({ n, v: fmt(v), cnt: '6m total' }));
          return {
            id: c.id,
            name: c.name,
            icon: c.icon,
            group: c.group,
            type: c.type,
            color: c.color,
            budget: Math.max(50, Math.round(avgAll * 1.05)),
            mtd: Math.round(c.mtd),
            avg: { all: avgAll, joint: avgAll, partner_a: Math.round(avgAll * 0.5), partner_b: Math.round(avgAll * 0.5) },
            history: hist,
            hist,
            merchants: topMerchants
          };
        });

      let newAccounts = [];
      if (balInput && balInput.files && balInput.files[0]) {
        const balText = await balInput.files[0].text();
        const balRows = parseCsvRows(balText);
        const latestBalByAcct = new Map();
        for (const r of balRows) {
          const aName = r.account || r['account name'] || 'Account';
          const bVal = parseFloat(String(r.balance || r.amount || '0').replace(/[^0-9.-]/g, '')) || 0;
          latestBalByAcct.set(aName, bVal);
        }
        newAccounts = Array.from(latestBalByAcct.entries()).map(([name, bal]) => {
          const nl = name.toLowerCase();
          const type = nl.includes('401') || nl.includes('ira') || nl.includes('roth') ? 'Retirement'
            : nl.includes('vanguard') || nl.includes('fidelity') || nl.includes('schwab') || nl.includes('brokerage') || nl.includes('invest') ? 'Investments'
            : nl.includes('hysa') || nl.includes('savings') || nl.includes('wealthfront') ? 'Cash (HYSA)'
            : nl.includes('card') || nl.includes('amex') || nl.includes('sapphire') || nl.includes('visa') ? 'Credit Card'
            : nl.includes('mortgage') || nl.includes('loan') ? 'Loan'
            : 'Cash';
          return { name, inst: name.split(' ')[0], type, apy: type.includes('HYSA') ? '4.50%' : '—', bal, owner: 'joint' };
        });
      } else {
        newAccounts = Array.from(acctSet).slice(0, 12).map(name => ({
          name, inst: name.split(' ')[0], type: 'Cash', apy: '—', bal: 10000, owner: 'joint'
        }));
      }

      app.isRealData = true;
      app.monthlyIncome = { all: avgMonthlyIncome, joint: avgMonthlyIncome, partner_a: Math.round(avgMonthlyIncome * 0.55), partner_b: Math.round(avgMonthlyIncome * 0.45) };
      if (newCategories.length) app.categories = newCategories;
      if (newAccounts.length) app.accounts = newAccounts;
      if (parsedTxs.length) app.transactions = parsedTxs;
      if (triageItems.length) app.triage = triageItems;

      await saveAppStateToServer();
      showToast(`✓ Imported ${txRows.length} Monarch transactions & saved to Unraid SQLite!`);
      setView('dashboard');
    }

    async function importMcpJsonFromTextarea() {
      const el = document.getElementById('mcp-json-input');
      if (!el || !el.value.trim()) {
        showToast('Paste a JSON snapshot from your Monarch MCP assistant first.');
        return;
      }
      try {
        const parsed = JSON.parse(el.value.trim());
        Object.assign(app, parsed, { isRealData: true });
        await saveAppStateToServer();
        showToast('✓ Imported Monarch MCP JSON snapshot into Unraid SQLite!');
        setView('dashboard');
      } catch (e) {
        showToast('Invalid JSON format: ' + e.message);
      }
    }

    async function resetToDemoData() {
      try {
        await fetch('/api/app-state', { method: 'DELETE' });
      } catch (e) {}
      window.location.reload();
    }

    async function loadAppStateFromServer() {
      try {
        const res = await fetch('/api/app-state');
        if (!res.ok) return;
        const data = await res.json();
        if (data && data.hasCustomState && data.state) {
          Object.assign(app, data.state);
          renderAll();
        }
      } catch (e) {
        // Standalone mode fallback
      }
    }

    async function startMonarchOAuthFlow() {
      try {
        showToast('Registering OAuth 2.1 PKCE session with api.monarch.com...');
        const res = await fetch('/api/oauth/start', { method: 'POST' });
        const data = await res.json();
        if (!res.ok || !data.authUrl) throw new Error(data.error || 'Failed to start OAuth');
        window.open(data.authUrl, '_blank', 'noopener,noreferrer');
        showToast('Opened Monarch OAuth login! Click Authorize, then paste the redirect URL into Step 2.');
      } catch (e) {
        showToast('OAuth start error: ' + e.message);
      }
    }

    async function completeMonarchOAuthExchange() {
      const input = document.getElementById('oauth-callback-input');
      const val = input ? input.value.trim() : '';
      if (!val) {
        showToast('Please paste the http://localhost:3080/callback?code=... URL into Step 2 first.');
        return;
      }
      try {
        showToast('Exchanging PKCE code & syncing live data from https://api.monarch.com/mcp...');
        const res = await fetch('/api/oauth/exchange', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ callbackUrlOrCode: val })
        });
        const data = await res.json();
        if (!res.ok || !data.ok) throw new Error(data.error || 'OAuth exchange failed');
        await loadAppStateFromServer();
        showToast('✓ Connected Monarch OAuth & synced live MCP data into Unraid SQLite!');
        setView('dashboard');
      } catch (e) {
        showToast('OAuth exchange error: ' + e.message);
      }
    }

    function renderAll() {
      renderCenter();
      renderInspector();
    }

    renderAll();
    loadAppStateFromServer();
  </script>
